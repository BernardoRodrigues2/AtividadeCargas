<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/motorista_atualizar.js" defer></script>
    <title>Atualizar Motorista</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Motorista</h1><br>
        <form>
            <label for="codigo">Código do Motorista</label><br>
            <input type="number" id="codigo" required><br><br>

            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="cnh">CNH</label><br>
            <input type="text" id="cnh" required><br><br>

            <label for="cpf">CPF</label><br>
            <input type="text" id="cpf" maxlength="11" required><br><br>

            <label for="telefone">Telefone</label><br>
            <input type="text" id="telefone" required><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
