<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/motorista_consultar_nome.js" defer></script>
    <title>Consultar Motorista por Nome</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Consultar Motorista por Nome</h1><br>
        <form>
            <label for="nome">Nome do Motorista</label><br>
            <input type="text" id="nome" required><br><br>
            <button id="btn_consultar">Consultar</button>
        </form>
        <div id="resposta" class="resposta"></div>
        <table id="tabela_motorista">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>CNH</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                </tr>
            </thead>
            <tbody id="dados_motorista"></tbody>
        </table>
    </main>
</body>
</html>
